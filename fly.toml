# fly.io config. App names are global on fly.io and "silly" is taken, so the
# app is stahnma-silly. It's served at silly.stahnma.us (see README), which is
# the domain in every image URL, so posted links survive a move off fly.io.
app = "stahnma-silly"
primary_region = "ord"

[env]
  PORT = "8080"
  SILLY_PUBLIC_URL = "https://silly.stahnma.us"

[http_service]
  internal_port = 8080
  force_https = true
  # Slack fetches the image when it shows the message; one machine stays up so
  # that fetch never waits for a cold start.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # Face detection (onnxruntime) and decoding photos need more than 256mb.
  memory = "512mb"
